<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5">
<title>Entrenador Digital Híbrido</title>
<meta name="description" content="Programa de mantenimiento físico de 12 semanas: calistenia, escalada/agarre y atletismo de bajo impacto.">
<meta name="theme-color" content="#203F37">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entren. Híbrido">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --paper:#F7F5EF;
  --paper-dim:#EFEBE1;
  --ink:#2A2721;
  --ink-soft:#6B6559;
  --line:#DED7C6;
  --pine:#2F5D50;
  --pine-dark:#203F37;
  --pine-tint:#E4EEE9;
  --ochre:#B8863B;
  --ochre-tint:#F3E7D2;
  --clay:#C1502E;
  --clay-tint:#FBE7DF;
  --sage:#4C7A57;
  --sage-tint:#E7F1E8;
  --white:#FFFFFF;
  --radius-card:14px;
  --radius-pill:999px;
  --shadow: 0 1px 2px rgba(42,39,33,.06), 0 4px 14px rgba(42,39,33,.05);
}
:root[data-theme="dark"], :root:not([data-theme="light"]) {
  /* App is intentionally light-mode by design brief (high contrast for 50+), but keep a dark fallback readable */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1D1B17;
    --paper-dim:#26241F;
    --ink:#F1EDE3;
    --ink-soft:#B7B0A0;
    --line:#3A362D;
    --pine-tint:#1E322C;
    --ochre-tint:#332A18;
    --clay-tint:#3A241D;
    --sage-tint:#20301F;
    --white:#252219;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --paper:#1D1B17; --paper-dim:#26241F; --ink:#F1EDE3; --ink-soft:#B7B0A0; --line:#3A362D;
  --pine-tint:#1E322C; --ochre-tint:#332A18; --clay-tint:#3A241D; --sage-tint:#20301F; --white:#252219;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:18px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Newsreader',Georgia,serif;
  font-weight:600;
  color:var(--ink);
  margin:0 0 .4em 0;
  letter-spacing:-.01em;
}
h1{font-size:2rem;}
h2{font-size:1.55rem;}
h3{font-size:1.22rem;}
p{margin:0 0 .8em 0;}
a{color:var(--pine);}
button{font-family:inherit;}
img,svg{max-width:100%;}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}

/* focus visibility for accessibility */
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
  outline:3px solid var(--pine);
  outline-offset:2px;
}

/* ---------- App shell ---------- */
.app-shell{
  display:flex;
  min-height:100vh;
}
.sidebar{
  width:264px;
  flex-shrink:0;
  background:var(--pine-dark);
  color:#EFEBE1;
  padding:28px 18px;
  display:flex;
  flex-direction:column;
  gap:6px;
  position:sticky;
  top:0;
  height:100vh;
  overflow-y:auto;
}
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 10px 22px 10px;
  border-bottom:1px solid rgba(255,255,255,.14);
  margin-bottom:16px;
}
.brand-mark{
  width:40px;height:40px;border-radius:10px;
  background:var(--ochre);
  display:flex;align-items:center;justify-content:center;
  font-size:20px;flex-shrink:0;
}
.brand-text{font-family:'Newsreader',serif;font-weight:600;font-size:1.12rem;line-height:1.2;color:#fff;}
.brand-text small{display:block;font-family:'Inter',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.03em;color:#C9CFC3;margin-top:2px;}

.nav-btn{
  display:flex;align-items:center;gap:12px;
  width:100%;
  text-align:left;
  background:transparent;
  border:none;
  color:#DCE4DA;
  padding:13px 12px;
  border-radius:10px;
  font-size:1.02rem;
  font-weight:500;
  cursor:pointer;
  transition:background .15s ease;
}
.nav-btn .ic{font-size:1.25rem;width:26px;text-align:center;flex-shrink:0;}
.nav-btn:hover{background:rgba(255,255,255,.08);}
.nav-btn.active{background:var(--ochre);color:#241C0E;font-weight:700;}

.main-col{
  flex:1;
  min-width:0;
  padding:32px 40px 100px 40px;
}
.view{display:none;}
.view.active{display:block;animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.page-head{margin-bottom:26px;}
.page-head .eyebrow{color:var(--ink-soft);font-size:.95rem;margin-bottom:2px;}

/* ---------- Cards ---------- */
.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow);
  padding:22px 24px;
}
.card + .card{margin-top:18px;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}

/* Medical warning banner */
.med-banner{
  display:flex;gap:16px;align-items:flex-start;
  background:var(--clay-tint);
  border:1px solid #E7B7A4;
  border-left:6px solid var(--clay);
  border-radius:var(--radius-card);
  padding:20px 22px;
  margin-bottom:22px;
}
.med-banner .ic{font-size:1.8rem;flex-shrink:0;}
.med-banner h3{color:var(--clay);margin-bottom:.3em;}
.med-banner ul{margin:.5em 0 0 1.1em;padding:0;}
.med-banner li{margin-bottom:.25em;}

/* Principle cards */
.principle-card{border-top:5px solid var(--pine);}
.principle-card.alt{border-top-color:var(--ochre);}
.principle-card h3{display:flex;align-items:center;gap:10px;}
.tag{
  display:inline-block;
  font-size:.78rem;
  font-weight:700;
  padding:3px 10px;
  border-radius:var(--radius-pill);
  background:var(--pine-tint);
  color:var(--pine-dark);
}
.tag.ochre{background:var(--ochre-tint);color:#7A5A24;}
.tag.clay{background:var(--clay-tint);color:#8C3A22;}
.tag.sage{background:var(--sage-tint);color:#2F4F37;}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;
  border-radius:12px;
  padding:14px 22px;
  font-size:1.02rem;
  font-weight:700;
  cursor:pointer;
  min-height:50px;
  transition:transform .08s ease, background .15s ease;
}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--pine);color:#fff;}
.btn-primary:hover{background:var(--pine-dark);}
.btn-ochre{background:var(--ochre);color:#241C0E;}
.btn-ochre:hover{background:#9E6F2C;}
.btn-outline{background:transparent;color:var(--pine);border:2px solid var(--pine);}
.btn-outline:hover{background:var(--pine-tint);}
.btn-sm{padding:10px 16px;font-size:.92rem;min-height:40px;border-radius:10px;}
.btn-video{background:var(--white);color:var(--pine-dark);border:2px solid var(--pine);}
.btn-video:hover{background:var(--pine-tint);}
.btn-block{width:100%;}

/* progress bar */
.progress-track{
  background:var(--paper-dim);
  border-radius:var(--radius-pill);
  height:16px;
  overflow:hidden;
  border:1px solid var(--line);
}
.progress-fill{
  height:100%;
  background:linear-gradient(90deg,var(--pine),var(--sage));
  border-radius:var(--radius-pill);
  transition:width .4s ease;
}

/* Bottom nav (mobile) */
.bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;
  background:var(--white);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  z-index:40;
  box-shadow:0 -2px 12px rgba(0,0,0,.06);
}
.bottom-nav-inner{display:flex;justify-content:space-around;}
.bn-btn{
  background:none;border:none;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  color:var(--ink-soft);
  font-size:.72rem;
  font-weight:600;
  padding:6px 4px;
  border-radius:10px;
  flex:1;
  cursor:pointer;
}
.bn-btn .ic{font-size:1.35rem;}
.bn-btn.active{color:var(--pine-dark);}
.bn-btn.active .ic{transform:translateY(-1px);}

/* Month tabs (calendar) */
.month-tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.month-tab{
  background:var(--white);
  border:2px solid var(--line);
  border-radius:var(--radius-pill);
  padding:11px 20px;
  font-weight:700;
  font-size:.98rem;
  cursor:pointer;
  color:var(--ink-soft);
}
.month-tab.active{border-color:var(--pine);background:var(--pine-tint);color:var(--pine-dark);}

.week-block{margin-bottom:26px;}
.week-head{
  display:flex;align-items:center;gap:12px;
  margin-bottom:12px;
}
.week-head h3{margin:0;}
.deload-badge{
  background:var(--ochre-tint);color:#7A5A24;
  font-size:.78rem;font-weight:700;
  padding:4px 12px;border-radius:var(--radius-pill);
  border:1px solid #E3C88F;
}

.day-card{border-left:5px solid var(--pine);}
.day-card.mid{border-left-color:var(--ochre);}
.day-card.end{border-left-color:var(--sage);}
.day-card-head{
  display:flex;justify-content:space-between;align-items:flex-start;
  gap:12px;margin-bottom:14px;flex-wrap:wrap;
}
.day-card-head h3{margin-bottom:2px;}
.day-card-head .sub{color:var(--ink-soft);font-size:.94rem;}

.check-row{display:flex;align-items:center;gap:10px;}
.check-row input[type=checkbox]{width:24px;height:24px;accent-color:var(--sage);cursor:pointer;}
.check-row label{font-weight:700;font-size:.95rem;color:var(--sage);cursor:pointer;}

table.exercise-table{width:100%;border-collapse:collapse;margin-top:8px;}
table.exercise-table th{
  text-align:left;font-size:.82rem;text-transform:none;color:var(--ink-soft);
  border-bottom:2px solid var(--line);padding:8px 8px;font-weight:700;
}
table.exercise-table td{
  padding:12px 8px;border-bottom:1px solid var(--line);font-size:.98rem;vertical-align:middle;
}
table.exercise-table tr:last-child td{border-bottom:none;}
.ex-name{font-weight:700;}
.ex-note{color:var(--ink-soft);font-size:.86rem;display:block;margin-top:2px;font-weight:400;}

/* Protocol steps (warmup/cooldown) */
.protocol-block{margin-bottom:22px;}
.protocol-block h3{display:flex;align-items:center;gap:10px;}
.step-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;}
.step-item{
  display:flex;gap:14px;align-items:flex-start;
  background:var(--paper-dim);
  border-radius:12px;
  padding:14px 16px;
}
.step-check{flex-shrink:0;margin-top:2px;width:24px;height:24px;accent-color:var(--pine);cursor:pointer;}
.step-body b{display:block;margin-bottom:2px;}
.step-body span{color:var(--ink-soft);font-size:.92rem;}
.timer-btn{margin-left:auto;flex-shrink:0;}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,18,14,.55);
  display:none;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal-overlay.open{display:flex;}
.modal-box{
  background:var(--white);border-radius:16px;padding:26px 26px 22px;max-width:440px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
}
.modal-box h3{margin-bottom:10px;}
.modal-close{float:right;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--ink-soft);line-height:1;}

/* Forms */
.field{margin-bottom:16px;}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:.96rem;}
.field input, .field select{
  width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:10px;
  font-size:1.02rem;font-family:inherit;background:var(--paper-dim);color:var(--ink);
}
.field input:focus, .field select:focus{border-color:var(--pine);outline:none;background:var(--white);}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:0 16px;}

.data-table{width:100%;border-collapse:collapse;margin-top:10px;}
.data-table th{text-align:left;font-size:.82rem;color:var(--ink-soft);border-bottom:2px solid var(--line);padding:8px;}
.data-table td{padding:10px 8px;border-bottom:1px solid var(--line);font-size:.95rem;}

.chart-wrap{position:relative;height:280px;margin-top:10px;}

.pill-toggle{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.pill-toggle button{
  background:var(--white);border:2px solid var(--line);border-radius:var(--radius-pill);
  padding:8px 16px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--ink-soft);
}
.pill-toggle button.active{border-color:var(--sage);background:var(--sage-tint);color:#2F4F37;}

/* Calendar grid view */
.cal-grid{width:100%;border-collapse:separate;border-spacing:6px;table-layout:fixed;}
.cal-grid thead th{
  font-size:.78rem;color:var(--ink-soft);font-weight:700;padding:4px 2px;text-align:center;
}
.cal-grid td{vertical-align:top;padding:0;}
.grid-cell{
  min-height:78px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--paper-dim);
  padding:8px 6px;
  display:flex;flex-direction:column;gap:4px;
  cursor:default;
}
.grid-cell .gc-daynum{font-size:.74rem;color:var(--ink-soft);font-weight:700;}
.grid-cell.rest{opacity:.55;}
.grid-cell.rest .gc-daynum{color:var(--ink-soft);}
.grid-cell.training{cursor:pointer;background:var(--white);border-width:2px;}
.grid-cell.training:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.grid-cell.training.lunes{border-color:var(--pine);}
.grid-cell.training.miercoles{border-color:var(--ochre);}
.grid-cell.training.viernes{border-color:var(--sage);}
.gc-label{font-size:.78rem;font-weight:700;line-height:1.15;}
.grid-cell.training.lunes .gc-label{color:var(--pine-dark);}
.grid-cell.training.miercoles .gc-label{color:#7A5A24;}
.grid-cell.training.viernes .gc-label{color:#2F4F37;}
.gc-done{margin-left:auto;font-size:.9rem;}
.gc-deload{font-size:.66rem;font-weight:700;color:#7A5A24;background:var(--ochre-tint);border-radius:6px;padding:1px 5px;align-self:flex-start;}
.legend-row{display:flex;gap:16px;flex-wrap:wrap;margin:10px 0 4px 0;font-size:.85rem;color:var(--ink-soft);}
.legend-dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}

.modal-box-lg{max-width:640px;max-height:85vh;overflow-y:auto;}

.empty-state{
  text-align:center;padding:30px 20px;color:var(--ink-soft);
}

@media (max-width: 980px){
  .grid-2{grid-template-columns:1fr;}
  .grid-3{grid-template-columns:1fr;}
  .form-grid{grid-template-columns:1fr;}
}
@media (max-width: 880px){
  .sidebar{display:none;}
  .main-col{padding:20px 16px 92px 16px;}
  .bottom-nav{display:block;}
  body{font-size:17px;}
  h1{font-size:1.6rem;}
}
</style>
</head>
<body>

<div class="app-shell">

  <!-- Desktop sidebar -->
  <nav class="sidebar" aria-label="Navegación principal">
    <div class="brand">
      <div class="brand-mark">🏔️</div>
      <div class="brand-text">Entrenador Digital<br>Híbrido<small>Plan de 12 semanas</small></div>
    </div>
    <button class="nav-btn active" data-view="dashboard"><span class="ic">🏠</span> Panel de control</button>
    <button class="nav-btn" data-view="warmup"><span class="ic">⏱️</span> Calentamiento</button>
    <button class="nav-btn" data-view="calendar"><span class="ic">📅</span> Calendario semanal</button>
    <button class="nav-btn" data-view="cooldown"><span class="ic">🧘</span> Vuelta a la calma</button>
    <button class="nav-btn" data-view="tracker"><span class="ic">📊</span> Registro y progreso</button>
  </nav>

  <main class="main-col" id="main-col">
    <!-- Views injected here -->
  </main>
</div>

<!-- Mobile bottom nav -->
<nav class="bottom-nav" aria-label="Navegación móvil">
  <div class="bottom-nav-inner">
    <button class="bn-btn active" data-view="dashboard"><span class="ic">🏠</span>Panel</button>
    <button class="bn-btn" data-view="warmup"><span class="ic">⏱️</span>Calent.</button>
    <button class="bn-btn" data-view="calendar"><span class="ic">📅</span>Plan</button>
    <button class="bn-btn" data-view="cooldown"><span class="ic">🧘</span>Estiram.</button>
    <button class="bn-btn" data-view="tracker"><span class="ic">📊</span>Progreso</button>
  </div>
</nav>

<!-- Video modal -->
<div class="modal-overlay" id="video-modal">
  <div class="modal-box">
    <button class="modal-close" id="video-modal-close" aria-label="Cerrar">✕</button>
    <h3 id="video-modal-title">Vídeo explicativo</h3>
    <p id="video-modal-desc" style="color:var(--ink-soft);">Se abrirá en una pestaña nueva de YouTube para reproducirlo con comodidad.</p>
    <a class="btn btn-primary btn-block" id="video-modal-link" href="#" target="_blank" rel="noopener">▶ Ver vídeo en YouTube</a>
  </div>
</div>

<!-- Session detail modal (used by grid calendar view) -->
<div class="modal-overlay" id="session-modal">
  <div class="modal-box modal-box-lg">
    <button class="modal-close" id="session-modal-close" aria-label="Cerrar">✕</button>
    <div id="session-modal-content"></div>
  </div>
</div>

<script>
/* ====================== DATA & STATE ====================== */
const YT = {
  sentadillaSilla: "https://www.youtube.com/watch?v=VqPjHTt78sQ",
  remoBanda: "https://www.youtube.com/watch?v=RBs3SqAwXOs",
  planchaRodillas: "https://www.youtube.com/watch?v=h_8LKL9inEo",
  flexionInclinada: "https://www.youtube.com/watch?v=uCTbmCjiF7Y"
};
function ytSearch(q){ return "https://www.youtube.com/results?search_query=" + encodeURIComponent(q); }

// Exercise sets per mesocycle (month) and day. "deload" version applied on week 4 (30-40% volume reduction).
const PROGRAM = {
  1: {
    label: "Mes 1 · Adaptación y Fuerza Base",
    range: "Semanas 1–4",
    intro: "Aprendizaje del movimiento, activación de agarre y construcción de una base de fuerza segura. RPE 6–7 (esfuerzo moderado, con margen).",
    days: {
      lunes: {
        title: "Fuerza & Calistenia",
        sub: "Ejercicios compuestos · RPE 6–7",
        cls: "",
        exercises: [
          {name:"Sentadilla asistida con silla", note:"Baja controlado, toca el asiento sin sentarte del todo", sets:3, reps:"10–12", rest:"90 s", url:YT.sentadillaSilla},
          {name:"Flexiones inclinadas (manos en banco/mesa)", note:"Cuerpo en línea recta, baja el pecho hacia el borde", sets:3, reps:"8–10", rest:"90 s", url:YT.flexionInclinada},
          {name:"Remo con banda elástica", note:"Codos pegados al cuerpo, aprieta omóplatos", sets:3, reps:"12–15", rest:"60 s", url:YT.remoBanda},
          {name:"Plancha sobre rodillas", note:"Abdomen firme, cadera alineada", sets:3, reps:"20–30 s", rest:"45 s", url:YT.planchaRodillas},
        ]
      },
      miercoles: {
        title: "Escalada, Agarre & Core",
        sub: "Fuerza de dedos y antebrazo, tronco estable",
        cls:"mid",
        exercises: [
          {name:"Dead hangs (colgarse de barra)", note:"Brazos ligeramente flexionados, hombros activos, pies con apoyo si es necesario", sets:4, reps:"10–15 s", rest:"90 s", url:ytSearch("dead hang colgarse de barra tecnica principiantes")},
          {name:"Elevaciones de rodillas (colgado o de pie)", note:"Sube las rodillas al pecho controlando el balanceo", sets:3, reps:"8–10", rest:"60 s", url:ytSearch("elevaciones de rodillas core ejercicio")},
          {name:"Plancha de rodillas", note:"Mantén la espalda recta, respira de forma continua", sets:3, reps:"20–30 s", rest:"45 s", url:YT.planchaRodillas},
          {name:"Cierres de puño con toalla", note:"Activación de agarre, aprieta 3 s y suelta", sets:3, reps:"12", rest:"45 s", url:ytSearch("ejercicios de agarre con toalla antebrazo")},
        ]
      },

/* ====================== SIMPLE TIMER (for warmup/cooldown steps) ====================== */
function formatTime(s){
  const m = Math.floor(s/60), sec = s%60;
  return (m>0 ? m+":"+String(sec).padStart(2,"0") : sec+" s");
}
function attachTimerHandlers(root){
  root.querySelectorAll("[data-timer-btn]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      let remaining = parseInt(btn.dataset.seconds, 10);
      if(btn._interval){ clearInterval(btn._interval); btn._interval=null; btn.textContent="▶ Iniciar"; return; }
      btn.textContent = "⏸ " + formatTime(remaining);
      btn._interval = setInterval(()=>{
        remaining -= 1;
        if(remaining <= 0){
          clearInterval(btn._interval); btn._interval=null;
          btn.textContent = "✔ Hecho";
          setTimeout(()=>{ btn.textContent = "▶ Iniciar"; }, 1500);
          return;
        }
        btn.textContent = "⏸ " + formatTime(remaining);
      }, 1000);
    });
  });
}

function renderProtocol(blocks, headTitle, headDesc){
  let html = `

    block.items.forEach((item, ii)=>{

      html += `
      <li class="step-item">
        <input type="checkbox" class="step-check" id="${id}">
        <div class="step-body" style="flex:1;">

    });
    html += `</ul></div>`;
  });
  return html;
}

function renderCalendarGrid(monthData){
  const weekStart = (calendarMonth-1)*4 + 1;
  let html = `
  <div class="legend-row">
    <span><span class="legend-dot" style="background:var(--pine);"></span>Lunes · Fuerza & Calistenia</span>

  <table class="cal-grid">
    <thead><tr>${DAY_COL_LABELS.map(l=>`<th>${l}</th>`).join("")}</tr></thead>
    <tbody>`;

  for(let w=0; w<4; w++){
    const weekNum = weekStart + w;
    const isDeload = (w === 3);
    html += `<tr>`;
    for(let c=0; c<7; c++){
      const dayKey = DAY_COL_KEY[c];
      if(dayKey){
        const dayData = monthData.days[dayKey];
        const sid = sessionId(calendarMonth, weekNum, dayKey);
        const isDone = !!progress[sid];
        html += `<td>
          <div class="grid-cell training ${dayKey}" data-open-session data-cal-month="${calendarMonth}" data-cal-week="${weekNum}" data-cal-day="${dayKey}" data-cal-deload="${isDeload?1:0}" tabindex="0" role="button" aria-label="${dayData.title}, semana ${weekNum}">
            <span class="gc-daynum">Sem. ${weekNum}</span>
            ${isDeload ? `<span class="gc-deload">Descarga</span>` : ""}
            <span class="gc-label">${dayData.title}</span>
            ${isDone ? `<span class="gc-done">✔️</span>` : ""}
          </div>
        </td>`;
      } else {
        html += `<td><div class="grid-cell rest"><span class="gc-daynum">Sem. ${weekNum}</span><span class="gc-label" style="color:var(--ink-soft);font-weight:500;">Descanso / Recuperación activa</span></div></td>`;
      }
    }
    html += `</tr>`;
  }
  html += `</tbody></table></div></div>`;
  return html;
}

const sessionModalContent = document.getElementById("session-modal-content");
function openSessionModal(month, week, day, isDeload){
  sessionModalContent.innerHTML = sessionDetailHTML(month, week, day, isDeload);
  sessionModal.classList.add("open");
  attachDayCardHandlers(sessionModalContent);
}
document.getElementById("session-modal-close").addEventListener("click", ()=> sessionModal.classList.remove("open"));
sessionModal.addEventListener("click", (e)=>{ if(e.target === sessionModal) sessionModal.classList.remove("open"); });

function attachDayCardHandlers(root){
  root.querySelectorAll("[data-video-url]").forEach(btn=>{
    btn.addEventListener("click", ()=> openVideoModal(btn.dataset.videoName, btn.dataset.videoUrl));
  });
  root.querySelectorAll("[data-session]").forEach(chk=>{
    chk.addEventListener("change", ()=>{
      progress[chk.dataset.session] = chk.checked;
      saveJSON(LS_PROGRESS, progress);
      // reflect completion mark on the grid cell behind the modal, if present
      const cell = document.querySelector(`[data-open-session][data-cal-month][data-cal-week][data-cal-day]`);
      document.querySelectorAll("[data-open-session]").forEach(c=>{
        const sid = sessionId(c.dataset.calMonth, c.dataset.calWeek, c.dataset.calDay);
        if(sid === chk.dataset.session){
          let mark = c.querySelector(".gc-done");
          if(chk.checked && !mark){
            mark = document.createElement("span");
            mark.className = "gc-done";
            mark.textContent = "✔️";
            c.appendChild(mark);
          } else if(!chk.checked && mark){
            mark.remove();
          }
        }
      });
    });
  });
}

/* ====================== VIEW: TRACKER ====================== */
let weightChart=null, measureChart=null;

function renderTracker(){
  const bodyRows = bodyLog.slice().sort((a,b)=> a.date.localeCompare(b.date));
  const activityRows = activityLog.slice().sort((a,b)=> b.date.localeCompare(a.date));

  return `
  <div class="page-head">
    <div class="eyebrow">Registro y tracker de progreso</div>
    <h1>Tu evolución a lo largo del plan</h1>
    <p style="color:var(--ink-soft);">Registra tus medidas semanalmente y tu actividad diaria fuera de las sesiones para ver tu progreso real.</p>
  </div>

  <div class="card">
    <h3>Registrar medidas corporales</h3>
    <form id="body-form">
      <div class="form-grid">
        <div class="field"><label for="bf-date">Fecha</label><input type="date" id="bf-date" required></div>
        <div class="field"><label for="bf-weight">Peso (kg)</label><input type="number" step="0.1" min="30" max="250" id="bf-weight" required></div>
        <div class="field"><label for="bf-waist">Cintura (cm)</label><input type="number" step="0.5" min="40" max="200" id="bf-waist"></div>
        <div class="field"><label for="bf-arm">Brazo (cm)</label><input type="number" step="0.5" min="15" max="70" id="bf-arm"></div>
        <div class="field"><label for="bf-thigh">Muslo (cm)</label><input type="number" step="0.5" min="25" max="100" id="bf-thigh"></div>
      </div>
      <button type="submit" class="btn btn-primary">Guardar registro</button>
    </form>
  </div>

  <div class="card">
    <h3>Evolución del peso</h3>
    <div class="chart-wrap"><canvas id="weight-chart"></canvas></div>
  </div>

  <div class="card">
    <h3>Evolución de medidas (cm)</h3>
    <div class="chart-wrap"><canvas id="measure-chart"></canvas></div>
  </div>

  <div class="card">
    <h3>Historial de medidas</h3>
    ${bodyRows.length===0 ? `<div class="empty-state">Aún no hay registros. Añade tu primera medición arriba.</div>` : `
    <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Fecha</th><th>Peso (kg)</th><th>Cintura</th><th>Brazo</th><th>Muslo</th></tr></thead>
      <tbody>
        ${bodyRows.slice().reverse().map(r=>`<tr><td>${r.date}</td><td>${r.weight}</td><td>${r.waist ?? "—"}</td><td>${r.arm ?? "—"}</td><td>${r.thigh ?? "—"}</td></tr>`).join("")}
      </tbody>
    </table>
    </div>`}
  </div>

  <div class="card">
    <h3>Registro diario de actividad externa</h3>
    <form id="activity-form">
      <div class="form-grid">
        <div class="field"><label for="af-date">Fecha</label><input type="date" id="af-date" required></div>
        <div class="field"><label for="af-type">Actividad</label>
          <select id="af-type">
            <option value="Caminata">Caminata</option>
            <option value="Bicicleta">Bicicleta</option>
            <option value="Otra">Otra</option>
          </select>
        </div>
        <div class="field"><label for="af-steps">Pasos</label><input type="number" min="0" id="af-steps"></div>
        <div class="field"><label for="af-km">Distancia (km)</label><input type="number" step="0.1" min="0" id="af-km"></div>
        <div class="field"><label for="af-time">Tiempo (min)</label><input type="number" min="0" id="af-time"></div>
      </div>
      <button type="submit" class="btn btn-primary">Añadir actividad</button>
    </form>
  </div>

  <div class="card">
    <h3>Historial de actividad</h3>
    ${activityRows.length===0 ? `<div class="empty-state">Aún no has registrado actividades externas.</div>` : `
    <div style="overflow-x:auto;">
    <table class="data-table">
      <thead><tr><th>Fecha</th><th>Actividad</th><th>Pasos</th><th>Km</th><th>Minutos</th></tr></thead>
      <tbody>
        ${activityRows.map(r=>`<tr><td>${r.date}</td><td>${r.type}</td><td>${r.steps ?? "—"}</td><td>${r.km ?? "—"}</td><td>${r.time ?? "—"}</td></tr>`).join("")}
      </tbody>
    </table>
    </div>`}
  </div>

  <div class="card">
    <h3>Plantilla de seguimiento en Excel</h3>
    <p style="color:var(--ink-soft);">Si prefieres llevar tu registro en una hoja de cálculo, descarga esta plantilla de plan de entrenamiento y rutina.</p>
    <a class="btn btn-ochre" href="https://plantisheets.com/wp-content/uploads/2025/04/plantilla-excel-plan-de-entrenamiento-y-rutina-gimnasio.zip" target="_blank" rel="noopener">⬇ Descargar plantilla Excel (.zip)</a>
  </div>
  `;
}

function drawTrackerCharts(){
  const bodyRows = bodyLog.slice().sort((a,b)=> a.date.localeCompare(b.date));
  const labels = bodyRows.map(r=>r.date);

  const wCanvas = document.getElementById("weight-chart");
  const mCanvas = document.getElementById("measure-chart");
  if(!wCanvas || !mCanvas) return;

  if(weightChart) weightChart.destroy();
  if(measureChart) measureChart.destroy();

  weightChart = new Chart(wCanvas, {
    type:"line",
    data:{ labels, datasets:[{ label:"Peso (kg)", data:bodyRows.map(r=>r.weight), borderColor:"#2F5D50", backgroundColor:"rgba(47,93,80,.12)", tension:.3, fill:true, pointRadius:4 }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{ y:{ ticks:{ color:"#6B6559" } }, x:{ ticks:{ color:"#6B6559" } } } }
  });

  measureChart = new Chart(mCanvas, {
    type:"line",
    data:{ labels, datasets:[
      { label:"Cintura", data:bodyRows.map(r=>r.waist), borderColor:"#B8863B", tension:.3, pointRadius:4 },
      { label:"Brazo", data:bodyRows.map(r=>r.arm), borderColor:"#4C7A57", tension:.3, pointRadius:4 },
      { label:"Muslo", data:bodyRows.map(r=>r.thigh), borderColor:"#C1502E", tension:.3, pointRadius:4 },
    ]},
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:"bottom", labels:{color:"#2A2721"}}}, scales:{ y:{ ticks:{ color:"#6B6559" } }, x:{ ticks:{ color:"#6B6559" } } } }
  });
}

/* ====================== ROUTER ====================== */
const VIEWS = {
  dashboard: { render: renderDashboard, after: null },
  warmup: { render: ()=> renderProtocol(WARMUP_BLOCKS, {eyebrow:"Antes de entrenar", title:"Calentamiento y activación (10–15 min)"}, "Protocolo interactivo previo a cada sesión: moviliza articulaciones, activa manos y muñecas para la escalada, y eleva progresivamente el pulso."), after: (root)=> attachTimerHandlers(root) },
  calendar: { render: renderCalendar, after: (root)=> attachCalendarHandlers(root) },
  cooldown: { render: ()=> renderProtocol(COOLDOWN_BLOCKS, {eyebrow:"Después de entrenar", title:"Vuelta a la calma y estiramientos (10 min)"}, "Protocolo posterior a cada sesión para relajar la musculatura, reducir la rigidez y facilitar la recuperación."), after: (root)=> attachTimerHandlers(root) },
  tracker: { render: renderTracker, after: (root)=> attachTrackerHandlers(root) },
};

function attachCalendarHandlers(root){
  root.querySelectorAll("[data-month]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      calendarMonth = parseInt(btn.dataset.month, 10);
      navigateTo("calendar");
    });
  });
  root.querySelectorAll("[data-calview]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      calendarViewMode = btn.dataset.calview;
      navigateTo("calendar");
    });
  });
  root.querySelectorAll("[data-open-session]").forEach(cell=>{
    const open = ()=> openSessionModal(
      parseInt(cell.dataset.calMonth,10),
      parseInt(cell.dataset.calWeek,10),
      cell.dataset.calDay,
      cell.dataset.calDeload === "1"
    );
    cell.addEventListener("click", open);
    cell.addEventListener("keydown", (e)=>{ if(e.key === "Enter" || e.key === " "){ e.preventDefault(); open(); } });
  });
  attachDayCardHandlers(root);
}

function attachTrackerHandlers(root){
  drawTrackerCharts();
  const bf = document.getElementById("body-form");
  bf.addEventListener("submit", (e)=>{
    e.preventDefault();
    const entry = {
      date: document.getElementById("bf-date").value,
      weight: parseFloat(document.getElementById("bf-weight").value),
      waist: parseFloat(document.getElementById("bf-waist").value) || null,
      arm: parseFloat(document.getElementById("bf-arm").value) || null,
      thigh: parseFloat(document.getElementById("bf-thigh").value) || null,
    };
    if(!entry.date || isNaN(entry.weight)) return;
    bodyLog.push(entry);
    saveJSON(LS_BODY, bodyLog);
    navigateTo("tracker");
  });
  const af = document.getElementById("activity-form");
  af.addEventListener("submit", (e)=>{
    e.preventDefault();
    const entry = {
      date: document.getElementById("af-date").value,
      type: document.getElementById("af-type").value,
      steps: parseInt(document.getElementById("af-steps").value) || null,
      km: parseFloat(document.getElementById("af-km").value) || null,
      time: parseInt(document.getElementById("af-time").value) || null,
    };
    if(!entry.date) return;
    activityLog.push(entry);
    saveJSON(LS_ACTIVITY, activityLog);
    navigateTo("tracker");
  });
}

const mainCol = document.getElementById("main-col");
function navigateTo(viewName){
  const view = VIEWS[viewName];
  if(!view) return;
  mainCol.innerHTML = `<div class="view active">${view.render()}</div>`;
  document.querySelectorAll(".nav-btn, .bn-btn").forEach(b=>{
    b.classList.toggle("active", b.dataset.view === viewName);
  });
  if(view.after) view.after(mainCol);
  window.scrollTo({top:0, behavior:"instant"});
}

document.querySelectorAll(".nav-btn, .bn-btn").forEach(btn=>{
  btn.addEventListener("click", ()=> navigateTo(btn.dataset.view));
});

navigateTo("dashboard");

if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("sw.js").catch(err=>{
      console.warn("No se pudo registrar el service worker:", err);
    });
  });
}
</script>
</body>
</html>
